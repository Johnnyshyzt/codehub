name: Nightly live bench

# Runs a small live matrix when provider secrets are present.
# Safe no-op when no keys are configured.

on:
  schedule:
    - cron: "0 16 * * *" # 00:00 CST / 16:00 UTC
  workflow_dispatch:

jobs:
  live-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Live matrix (smoke tasks)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
        run: |
          set -e
          if python -c "from core.config import configured_provider_names, load_env; load_env(); raise SystemExit(0 if configured_provider_names() else 1)"; then
            codehub bench --matrix --only write_hello,fix_mul_bug --no-update-scores
          else
            echo "No provider API keys in secrets; skipping live matrix."
          fi
